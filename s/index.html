<title>Shared with Auramy</title>
<meta name="description" content="Photos and videos shared with Auramy, in original quality. Open to see and save them.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/icon.png">
<meta property="og:title" content="Photos shared with Auramy">

<meta property="og:image" content="https://auramyy.github.io/assets/icon.png">
<meta property="og:type" content="website">
<!--
  A shared link: https://auramyy.github.io/s/#<manifest id>.

  The id after the # never reaches this server — browsers keep the fragment
  to themselves — and the page has no server anyway. Everything here runs in
  the visitor's browser: it reads the manifest straight from the sender's
  Google Drive, where the Auramy app put it, and shows and saves the files
  from there. With Auramy installed, the phone opens the app instead of this
  page (apple-app-site-association, assetlinks.json).

  The manifest is the same JSON the apps read (DriveShareReceive.swift/.kt):
  {v, sender{id,name,platform}, created, expires, noLocation?,
   files[{drive, sha256, file{id,name,size,mime,created?,group?,role?,still?}}]}
-->
<style>
  :root {

    :root {

  header {

  h1 { font-size: 1.6rem; line-height: 1.2; margin: .9rem 0 .4rem; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .meta { color: var(--muted); margin: 0; font-size: .95rem; }
  main { max-width: 52rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin: .25rem 0 .75rem; }
  button, .button {
    font: inherit; font-weight: 600;
    border: 0; border-radius: 14px;

    display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  }
  .primary { background: var(--accent); color: var(--accent-text); }
  .secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .6; cursor: default; }
  .status { text-align: center; color: var(--muted); font-size: .9rem; min-height: 1.4em; margin: 0 0 1rem; }
  .note { text-align: center; color: var(--muted); font-size: .85rem; margin: 0 0 1.25rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 4px; }
  .tile {
    position: relative; aspect-ratio: 1; overflow: hidden;
    background: var(--surface); border-radius: 8px; display: block;
  }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .tag {
    position: absolute; left: 6px; bottom: 6px;
    background: rgba(0, 0, 0, .55); color: #fff;
    font-size: .7rem; font-weight: 600; padding: .1rem .4rem; border-radius: 6px;
  }
  .tile .get {
    position: absolute; right: 6px; top: 6px;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(0, 0, 0, .55); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .tile .name {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: .4rem; font-size: .75rem; color: var(--muted); text-align: center; overflow-wrap: anywhere;
  }
  .problem { text-align: center; padding: 3rem 1rem; }
  .problem p { font-size: 1.1rem; margin: 0 0 1.5rem; }
  .app {
    margin-top: 2.5rem; padding: 1.25rem; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  }
  .app p { margin: 0 0 1rem; color: var(--muted); }
  .app .row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 1rem 2.5rem; }
  footer a { color: var(--muted); margin: 0 .5rem; }
  .spinner {
    width: 28px; height: 28px; margin: 2rem auto; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>

</main>

<footer>

function pickLanguage() {
  for (const tag of navigator.languages || [navigator.language || "en"]) {
    const lower = tag.toLowerCase();
    if (lower.startsWith("zh")) return /hant|tw|hk|mo/.test(lower) ? "zh-Hant" : "zh-Hans";
    if (/^(nb|no|nn)\b/.test(lower)) return "nb";
    const base = lower.split("-")[0];
    if (T[base]) return base;
  }
  return "en";
}

  while (value >= 1000 && unit < units.length - 1) { value /= 1000; unit++; }
  return new Intl.NumberFormat(lang, { maximumFractionDigits: unit < 2 ? 0 : 1 }).format(value) + " " + units[unit];
};

$("getApp").textContent = t("getApp");

function showProblem(key) {

// What a person counts: a Live Photo's two files (or a motion photo split
// for the trip) are one picture. The still is what a browser can keep.
function itemsOf(manifest) {
  const items = [];
  const groups = new Map();
  for (const entry of manifest.files) {
    const file = entry.file;
    if (file.group) {
      let item = groups.get(file.group);
      if (!item) {
        item = { live: true, files: [] };
        groups.set(file.group, item);
        items.push(item);
      }
      item.files.push(entry);
      if (file.role !== "liveVideo") item.main = entry;
    } else {
      items.push({ live: false, files: [entry], main: entry });
    }
  }
  for (const item of items) item.main = item.main || item.files[0];
  return items;
}

async function fetchFile(entry, onBytes) {
  const response = await fetch(api(entry.drive));
  if (response.status === 404) throw new Error("expired");
  if (response.status === 403 || response.status === 429) throw new Error("unavailable");
  if (!response.ok) throw new Error("failed");
  const reader = response.body.getReader();
  const parts = [];
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value);
    onBytes(value.length);
  }
  return new File(parts, entry.file.name, { type: entry.file.mime || "application/octet-stream" });

          zip.file(unique(entry.file.name), file, { binary: true, compression: "STORE", date: new Date(entry.file.created || Date.now()) });
        }
        const blob = await zip.generateAsync({ type: "blob", streamFiles: true });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Auramy-${manifest.sender.name}.zip`.replace(/[\\/:*?"<>|]/g, "_");
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 60_000);
        status.textContent = t("originals");
      } catch (error) {
        status.textContent = t(["expired", "unavailable"].includes(error.message) ? error.message : "failed");
      }
      save.disabled = false;
    };
  }
}

main();
</script>
</body>
</html>
